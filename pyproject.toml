[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccg"
version = "0.1.0"
description = "Visual grounding correctness-ranking reliability under candidate-set changes with frozen vision-language features, selective-risk evaluation, and auditable research evidence."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "AlanAkillove" }]
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "torchvision>=0.16",
    "open_clip_torch>=2.24",
    "pycocotools>=2.0.7",
    "h5py>=3.10",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "black>=24.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
